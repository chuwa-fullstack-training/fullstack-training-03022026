<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Home</title>
  </head>
  <body>
    <form action="/create-post" method="POST">
      <label>Name:</label>
      <input type="text" name="name" />

      <label>Age:</label>
      <input type="text" name="age" />

      <button type="submit">Submit</button>
    </form>

    <div id="result"></div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name") || ""; // first time there is no submission, so put empty string here.
      const age = params.get("age") || ""; 

      document.getElementById("result").innerHTML = `
        <p>Name: ${name}</p>
        <p>Age: ${age}</p>
      `;
    </script>
  </body>
</html>
